spring.application.name=digitalfix-ms-catalog
server.port=8081

# Conexion Oracle RDS mediante variables de entorno
# La conexión se completa mediante variables del entorno de despliegue.
# La credencial Oracle debe renovarse antes del despliegue final.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA crea y actualiza las tablas necesarias sin borrar los datos existentes
spring.jpa.hibernate.ddl-auto=update

# Evita mantener sesiones de persistencia abiertas durante toda la respuesta HTTP
spring.jpa.open-in-view=false
