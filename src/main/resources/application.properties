spring.application.name=digitalfix-ms-catalog
server.port=8081

# Conexion Oracle RDS mediante variables de entorno
spring.datasource.url=jdbc:oracle:thin:@//${DB_HOST}:${DB_PORT:1521}/${DB_SERVICE:ORCL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA crea y actualiza las tablas necesarias sin borrar los datos existentes
spring.jpa.hibernate.ddl-auto=update

# Evita mantener sesiones de persistencia abiertas durante toda la respuesta HTTP
spring.jpa.open-in-view=false