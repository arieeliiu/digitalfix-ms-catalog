spring.application.name=digitalfix-ms-catalog

# Conexión Oracle RDS mediante variables de entorno
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA crea y actualiza las tablas necesarias sin borrar los datos existentes
spring.jpa.hibernate.ddl-auto=update

# Evita mantener sesiones de persistencia abiertas durante toda la respuesta HTTP
spring.jpa.open-in-view=false